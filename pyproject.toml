[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004",
  "DTZ011", "E", "F", "F541", "FLY", "FURB", "G", "I", "INP", "ISC",
  "ICN001", "LOG", "N804", "N805", "N806", "N815", "PERF", "PGH", "PIE",
  "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S107", "S102", "S103",
  "S108", "S301", "S306", "S307", "SIM", "SLF", "SLOT", "T100", "T20",
  "TC", "TID", "TRY", "UP", "W",
]
ignore = [
  # Same ignore list Home Assistant core uses for its own integrations —
  # most of these are style calls that don't fit a small custom_component
  # (e.g. TC00x wants runtime-only imports gated behind TYPE_CHECKING,
  # which HA core itself doesn't do for platform files either).
  "ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019", "D202", "D203",
  "D213", "D406", "D407", "D417", "E501", "PLC1901", "PLR0911", "PLR0912",
  "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0108", "PLW1641",
  "PLW2901", "PT011", "PT018", "RUF001", "RUF012", "RUF015", "SIM102",
  "SIM103", "SIM108", "SIM115", "TC001", "TC002", "TC003", "TC006",
  "TRY003", "TRY400", "W191", "E111", "E114", "E117", "D206", "D300",
  "COM812", "COM819", "PLE0605",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "INP001"]
